name: CI

# Every job blocks a merge except the offline-tooling leg of python-tests and dependency-review.
#
#   - backend:         `sbt compile` + `scalafmtCheckAll` + `scalafmtSbtCheck`.
#   - frontend:        asset build (`npm run build`) + the lint steps (ESLint, Stylelint, HTMLHint, locale checks,
#                      CSS layout, asset paths, vendor versions, JS types, spec base class) + the jsdom `jest` suite in
#                      test/js/.
#                      Jest reports JS coverage but has no floor — the number can't support one yet, see #5112.
#   - evolutions-lint: static checks on conf/evolutions/default/*.sql.
#   - shell-lint:      ShellCheck over the repo's .sh files.
#   - route-lint:      conf/routes reachability — fails if any route is shadowed by an earlier one.
#   - backend-tests:   the whole of test/ against a real Postgres+PostGIS. Boots the app, which auto-applies pending
#                      evolutions, so it doubles as the forward-apply gate. Also carries the statement-coverage
#                      ratchet (#4743).
#   - e2e-smoke:       Playwright browser smoke tests (test/e2e/) against a staged app + the CI database. Loads each
#                      core page in headless Chromium and fails on uncaught console/page errors; also carries the
#                      axe-core accessibility gate (a11y.spec.js, #5060).
#   - python-tests:    pytest unit tests for the Python scripts in scripts/ and tools/. One leg per interpreter the web
#                      container ships — 3.8 for the in-band script, 3.13 for the offline tooling (advisory: it covers
#                      an operator utility that never runs on the server).
#   - dependency-review: PRs only. Flags a dependency the PR adds or changes that has a known vulnerability (advisory:
#                      the app's Python is stuck on 3.8, where some fixes can't install, #4396).

on:
  pull_request:
  push:
    branches: [develop, master, main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (compile + scalafmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: sbt

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      # Dummy env so any config evaluation during compile has values. Compilation does not touch the database.
      - name: Compile (blocking gate)
        run: sbt -v compile
        env:
          SIDEWALK_APPLICATION_SECRET: dummy-ci-secret
          INTERNAL_API_KEY: dummy-ci-internal-key

      # `if: always()` runs these even when an earlier step failed, so compile and format problems show up in one
      # run (sbt stops at its first failing command). Auto-format locally with `make scalafmt-fix`.
      - name: scalafmt check (blocking)
        if: always()
        run: sbt scalafmtCheckAll

      - name: scalafmt check, build files (blocking)
        if: always()
        run: sbt scalafmtSbtCheck

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      # Not `npm install`: it would re-resolve the versions behind every blocking gate in this job on each run (#5152).
      - name: Install dependencies
        run: npm ci

      # The same command the deploy runs (sidewalk-tools' build.sh): Vite, for every page's JS and CSS bundle.
      - name: Build assets
        run: npm run build

      # Every lint step below is `if: always()`, so all frontend problems surface in one run even when an earlier step
      # failed. Each has a `make` target of the same name for running it locally.
      #
      # Same paths `make eslint` defaults to; build/ and lib/ are carved out by eslint.config.js's own `ignores`. No
      # `--max-warnings` flag on purpose: the config's one `warn` rule (max-len) is deliberately advisory — CLAUDE.md
      # sanctions long-line exceptions, so an over-limit line nags but doesn't block; every other rule is an `error`.
      - name: ESLint (blocking)
        if: always()
        run: npx eslint frontend/js/ public/locales/ test/js/ test/e2e/ playwright.config.js

      # Only our sources: vendored and built CSS live under public/, outside the glob. It is single-quoted so Stylelint's
      # own globber expands `**` (not the shell). Like ESLint, no `--max-warnings` flag: the one `warning` rule
      # (max-line-length) is advisory.
      - name: Stylelint (blocking)
        if: always()
        run: npx stylelint 'frontend/css/**/*.css'

      # The Twirl templates; htmlhint reads its rules from .htmlhintrc.
      - name: HTMLHint (blocking)
        if: always()
        run: npx htmlhint app/views

      # Cross-locale key parity and empty values for public/locales/. i18next-aware where a per-file JSON rule can't
      # be: it normalizes plural suffixes and treats en-US/en-NZ and the per-city overlays as override-only.
      - name: Locale checks (blocking)
        if: always()
        run: node tools/lint/check-locale-parity.mjs

      # The frontend/css/ layout (#5030, #5651): a page's stylesheet is imported only by its page's entry, page class
      # prefixes stay in the page's own files, every stylesheet is imported by something, and every view that loads an
      # entry's JS asks for its styles.
      - name: CSS layout (blocking)
        if: always()
        run: node tools/lint/check-css-layout.mjs

      # Asset URLs in frontend/js/ (#4893): no hardcoded '/assets/...' outside the tool's allowlist, and every literal
      # util.assetPath() argument names a real file in a family the digest manifest covers. Both halves of a mistake
      # here are silent (a missing asset resolves to its plain path rather than throwing), so nothing else would catch
      # one.
      - name: Asset paths (blocking)
        if: always()
        run: node tools/lint/check-asset-paths.mjs

      # The self-hosted libraries in public/vendor/ (#4399) are listed in docs/upgrading-libraries.md at the versions
      # in their filenames. No Dependabot ecosystem watches that folder, so that doc is their whole inventory.
      - name: Vendor versions (blocking)
        if: always()
        run: node tools/lint/check-vendor-versions.mjs

      # TypeScript checks frontend/js/ against its JSDoc types (#5278).
      - name: JS types (blocking)
        if: always()
        run: node tools/lint/check-js-types.mjs

      # Every backend spec extends util.SidewalkSpec, never PlaySpec (#3936). In this job because it needs only node.
      - name: Spec base class (blocking)
        if: always()
        run: node tools/lint/check-spec-base.mjs

      # The jsdom unit suite (test/js/). Thin coverage is why there's no `coverageThreshold` (jest.config.js says why).
      - name: Jest unit tests (blocking)
        if: always()
        run: npm run test:js:coverage

  evolutions-lint:
    name: Evolutions lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Catches Play-evolution footguns the database won't flag until apply time (e.g. a semicolon mid-`--`-comment,
      # which Play splits on -- the bug that broke evolution 325). Invoked via `bash` (not `./`) so it doesn't depend on
      # the file's executable bit, which git on some dev setups (core.fileMode=false) drops.
      - name: Lint evolution files
        run: bash db/scripts/lint-evolutions.sh

  shell-lint:
    name: Shell script lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Runs from the Docker image pinned in docker/shellcheck/Dockerfile, so CI and `make shellcheck` use the same
      # version.
      - name: Run ShellCheck
        run: bash tools/lint/shellcheck.sh

  route-lint:
    name: Route reachability lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.8
        uses: actions/setup-python@v7
        with:
          python-version: '3.8'

      # Fails if any conf/routes entry is unreachable because an earlier same-method route already matches all of its
      # request paths. Play commits to the first path-pattern match and 400s on a typed-param mismatch instead of
      # falling through, so a wildcard placed above a literal sibling silently breaks it (#456). Stdlib only, so no pip
      # install. RouteReachabilitySpec (in backend-tests) is the compiled-router counterpart, which also covers routes
      # contributed by sub-router includes.
      - name: Check route reachability
        run: python3 tools/lint/check_route_reachability.py

  backend-tests:
    name: Backend tests (API, PostGIS)
    runs-on: ubuntu-latest
    # A spec that hangs on the DB waits out its own 120s timeout and the next one starts, so a bad run degrades
    # slowly instead of failing. The suite is ~10 min locally, so 30 is generous without being open-ended.
    timeout-minutes: 30
    # Booting the app makes this the forward-evolution-apply gate. Runs all of test/, so a spec is covered by
    # existing rather than by being named in this file (#5042).
    #
    # Dummy env mirroring docker-compose.yml's web service, so the app boots exactly as it does in dev. The application
    # secret must be >=256 bits (32+ chars) for Play's HS256 JWT sessions, hence the long value. Job-level because
    # every sbt step needs it, `coverageReport` included — it boots nothing but still evaluates config to load the
    # build. Safe for the docker compose steps: docker-compose.yml interpolates none of these.
    env:
      DATABASE_URL: jdbc:postgresql://localhost:5432/sidewalk
      DATABASE_USER: sidewalk
      DATABASE_PASSWORD: sidewalk
      SIDEWALK_CITY_ID: teaneck-nj
      SIDEWALK_APPLICATION_SECRET: DUMMY_APPLICATION_SECRET_SET_CORRECTLY_ON_PRODUCTION
      SILHOUETTE_SIGNER_KEY: DUMMY_SILHOUETTE_SIGNER_KEY
      SILHOUETTE_CRYPTER_KEY: DUMMY_SILHOUETTE_CRYPTER_KEY
      INTERNAL_API_KEY: DUMMY_INTERNAL_API_KEY
      SIDEWALK_AI_API_KEY: DUMMY_SIDEWALK_AI_API_KEY
      MAPBOX_API_KEY: DUMMY_MAPBOX_API_KEY
      GOOGLE_MAPS_API_KEY: DUMMY_GOOGLE_API_KEY
      GOOGLE_MAPS_SECRET: DUMMY_GOOGLE_SECRET
      GEMINI_API_KEY: DUMMY_GEMINI_API_KEY
      SCISTARTER_API_KEY: DUMMY_SCISTARTER_API_KEY
      MAPILLARY_ACCESS_TOKEN: DUMMY_MAPILLARY_ACCESS_TOKEN
      GA_SERVICE_ACCOUNT_KEY: DUMMY_GA_SERVICE_ACCOUNT_KEY
      INFRA3D_CLIENT_ID_ZURICH: DUMMY_INFRA3D_CLIENT_ID
      INFRA3D_CLIENT_ID_WINTERTHUR: DUMMY_INFRA3D_CLIENT_ID
      INFRA3D_CLIENT_SECRET_ZURICH: DUMMY_INFRA3D_CLIENT_SECRET
      INFRA3D_CLIENT_SECRET_WINTERTHUR: DUMMY_INFRA3D_CLIENT_SECRET
      ENV_TYPE: local
      SIDEWALK_IMAGES_DIR: .crops
      SIDEWALK_PANO_DIR: .panos
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: sbt

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      # Bring up Postgres+PostGIS exactly as dev does (db/Dockerfile + init.sh, which restores the shared
      # sidewalk_login schema and the sidewalk_init template). A runner's `pgdata18` volume starts empty, so init.sh
      # runs; locally, an existing volume skips it and you get your own dev DB.
      - name: Start database
        run: docker compose up -d --build db

      # Readiness has to be probed over TCP, because only TCP proves the server the tests will actually talk to is up.
      #
      # The postgres entrypoint runs /docker-entrypoint-initdb.d/init.sh against a *temporary* server started with
      # `listen_addresses=''` — reachable on the container's Unix socket, but not on port 5432. Only once init.sh
      # returns does it stop that server and exec the real one, which is the first thing to listen on TCP. A
      # Unix-socket probe therefore reports success partway through init.sh (sidewalk_login lands at its pg_restore,
      # with the remaining grants and the entire server restart still ahead of it), letting the job race on to
      # `sbt testOnly` and fail with "Connection to localhost:5432 refused" whenever the compile is quick enough to
      # get there first — an intermittent failure in which every database step reports success and zero tests run.
      #
      # `-h 127.0.0.1` is what forces TCP and must not be "simplified" away: with no host, psql takes the Unix socket
      # and the probe goes back to answering the wrong question. Asserting the schema in the same query covers the
      # other half, so one command establishes both that the real server is listening and that init.sh finished.
      - name: Wait for the database to accept TCP connections
        run: |
          for i in $(seq 1 90); do
            if docker compose exec -T -e PGPASSWORD=sidewalk db \
                 psql -h 127.0.0.1 -p 5432 -U postgres -d sidewalk -tAc \
                 "SELECT 1 FROM information_schema.schemata WHERE schema_name='sidewalk_login'" 2>/dev/null | grep -q 1; then
              echo "Database is accepting TCP connections and initialized."; exit 0
            fi
            sleep 2
          done
          echo "Database did not become reachable in time."; docker compose logs db | tail -50; exit 1

      # The real city dumps are git-ignored (too large to commit); CI only has the small, committed sidewalk_init
      # template that init.sh restored above. So build the test city from that template: rename the schema to
      # sidewalk_teaneck (matching cityparams.conf's `teaneck-nj = "sidewalk_teaneck"`). Beyond the seed below the
      # schema stays empty, so specs assert response contract/shape and self-seed whatever data they read.
      #
      # We connect the app as the `sidewalk` superuser (DATABASE_USER above), not the per-city role, and point its
      # search_path at the city schema. Reason: this template is behind the repo's evolution HEAD, so the app
      # auto-applies pending evolutions on boot; some touch shared sidewalk_login tables (e.g. auth_tokens) that a city
      # role can't ALTER ("must be owner"). The superuser owns everything, so evolutions apply cleanly. (In dev this
      # never arises because the imported city dump is already at HEAD.)
      - name: Create test city schema (teaneck) from the sidewalk_init template
        run: |
          docker compose exec -T db psql -v ON_ERROR_STOP=1 -U postgres -d sidewalk -c "
          ALTER SCHEMA sidewalk_init RENAME TO sidewalk_teaneck;
          ALTER ROLE sidewalk SET search_path = sidewalk_teaneck, sidewalk_login, public;"

      # Its own step, ahead of everything, because booting the app is what auto-applies the evolutions: the seed below
      # needs the evolved schema and the suite below needs the seed. EvolutionsApplySpec asserts the schema reached
      # HEAD rather than stopping partway.
      #
      # `coverage` instruments this step and the suite, for the `coverageReport` at the end of the job (#4743).
      - name: Apply evolutions
        run: sbt coverage "testOnly models.utils.EvolutionsApplySpec"

      # Without this the suite's data-dependent half cancels itself out. Must follow the step above: it writes
      # street_edge.status and needs constraints from well past the template's evolution level. Shared with test/e2e:
      # one definition of the test city.
      - name: Seed the test city
        run: docker compose exec -T db psql -v ON_ERROR_STOP=1 -U postgres -d sidewalk < test/e2e/fixtures/ci-seed.sql

      # Keeps this job's media dirs identical to e2e-smoke's; the script's header says why they're needed at all.
      - name: Install the seeded imagery
        run: bash test/e2e/fixtures/install-media.sh

      # Suites run one at a time — see `Test / parallelExecution := false` in build.sbt for why. A CANCELED line here
      # means the seed stopped covering something.
      - name: Run the backend suite
        run: sbt coverage test

      # Enforces the ratchet in build.sbt (#4743). Deliberately not `if: always()`, unlike the lint steps: a run that
      # aborted partway measures a fraction of the real number, so it would pile a ratchet failure on top of the spec
      # failure that actually needs fixing.
      #
      # The guard is what keeps this gate from silently becoming a no-op. `coverageReport` warns and exits 0 when the
      # data dir is empty, and the compiler plugin empties it on every instrumented compile — so anything that
      # recompiles after the spec steps (an added sbt step, a plugin bump that invalidates zinc) would turn a required
      # check green with nothing measured.
      - name: Coverage report (blocking ratchet)
        run: |
          test -s target/scala-*/scoverage-data/scoverage.coverage \
            || { echo "::error::no scoverage data — the spec steps above did not run under \`coverage\`, or something recompiled after them"; exit 1; }
          sbt coverageReport

      # `always()` rather than `failure()`: a green run is when you most want this, since raising the floor means
      # finding where the headroom is, and the console prints only the total. On an earlier-step failure the report
      # step is skipped and there is nothing to upload, which this tolerates quietly.
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scoverage-report
          path: target/scala-*/scoverage-report/
          retention-days: 7
          if-no-files-found: ignore

  e2e-smoke:
    name: E2E smoke (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Job-level env (shared by `sbt stage` and the app process), mirroring backend-tests' block. Every key is a
    # dummy on purpose: Mapbox and Google Maps are both stubbed in-suite (test/e2e/fixtures.js), so no page hits the
    # network — and no test can bill a Google SKU (#5129: a run against the real API was ~20 billable panorama
    # instantiations, from Explore's tutorial and the label-detail popup that /labelMap, /gallery, /dashboard and
    # /stories build at page load). A real key must never come back here.
    env:
      DATABASE_URL: jdbc:postgresql://localhost:5432/sidewalk
      DATABASE_USER: sidewalk
      DATABASE_PASSWORD: sidewalk
      SIDEWALK_CITY_ID: teaneck-nj
      SIDEWALK_APPLICATION_SECRET: DUMMY_APPLICATION_SECRET_SET_CORRECTLY_ON_PRODUCTION
      SILHOUETTE_SIGNER_KEY: DUMMY_SILHOUETTE_SIGNER_KEY
      SILHOUETTE_CRYPTER_KEY: DUMMY_SILHOUETTE_CRYPTER_KEY
      INTERNAL_API_KEY: DUMMY_INTERNAL_API_KEY
      SIDEWALK_AI_API_KEY: DUMMY_SIDEWALK_AI_API_KEY
      MAPBOX_API_KEY: DUMMY_MAPBOX_API_KEY
      GOOGLE_MAPS_API_KEY: DUMMY_GOOGLE_API_KEY
      GOOGLE_MAPS_SECRET: DUMMY_GOOGLE_SECRET
      GEMINI_API_KEY: DUMMY_GEMINI_API_KEY
      SCISTARTER_API_KEY: DUMMY_SCISTARTER_API_KEY
      MAPILLARY_ACCESS_TOKEN: DUMMY_MAPILLARY_ACCESS_TOKEN
      GA_SERVICE_ACCOUNT_KEY: DUMMY_GA_SERVICE_ACCOUNT_KEY
      INFRA3D_CLIENT_ID_ZURICH: DUMMY_INFRA3D_CLIENT_ID
      INFRA3D_CLIENT_ID_WINTERTHUR: DUMMY_INFRA3D_CLIENT_ID
      INFRA3D_CLIENT_SECRET_ZURICH: DUMMY_INFRA3D_CLIENT_SECRET
      INFRA3D_CLIENT_SECRET_WINTERTHUR: DUMMY_INFRA3D_CLIENT_SECRET
      ENV_TYPE: local
      # The staged app runs in prod mode, which arms PersistentMediaDirCheck (#4925): every media directory must
      # resolve outside the build tree or the app refuses to boot. Literal paths, not ${{ runner.temp }} — the
      # `runner` context is unavailable in a job-level `env:`, and referencing it there fails the whole workflow at
      # load time, which shows up as a run with no jobs rather than as a failing check.
      SIDEWALK_IMAGES_DIR: /tmp/sidewalk-media/crops
      SIDEWALK_PANO_DIR: /tmp/sidewalk-media/panos
      SIDEWALK_SHARE_IMAGES_DIR: /tmp/sidewalk-media/share-images
      SIDEWALK_STORY_MEDIA_DIR: /tmp/sidewalk-media/story-media
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: sbt

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      # MUST precede `sbt stage`: the staged app serves public/ from the packaged assets jar, and the built bundles
      # (public/build/) are git-ignored — without them every page 404s its own JS/CSS.
      - name: Build frontend assets
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # DB bring-up + readiness + schema setup are copied verbatim from backend-tests; see the comments there
      # (especially why the readiness probe must stay on TCP via `-h 127.0.0.1`).
      - name: Start database
        run: docker compose up -d --build db

      - name: Wait for the database to accept TCP connections
        run: |
          for i in $(seq 1 90); do
            if docker compose exec -T -e PGPASSWORD=sidewalk db \
                 psql -h 127.0.0.1 -p 5432 -U postgres -d sidewalk -tAc \
                 "SELECT 1 FROM information_schema.schemata WHERE schema_name='sidewalk_login'" 2>/dev/null | grep -q 1; then
              echo "Database is accepting TCP connections and initialized."; exit 0
            fi
            sleep 2
          done
          echo "Database did not become reachable in time."; docker compose logs db | tail -50; exit 1

      - name: Create test city schema (teaneck) from the sidewalk_init template
        run: |
          docker compose exec -T db psql -v ON_ERROR_STOP=1 -U postgres -d sidewalk -c "
          ALTER SCHEMA sidewalk_init RENAME TO sidewalk_teaneck;
          ALTER ROLE sidewalk SET search_path = sidewalk_teaneck, sidewalk_login, public;"

      # Unlike backend-tests (which boots the app in-JVM via ScalaTest), the smoke suite needs the app actually
      # serving HTTP. Stage a prod-mode binary: it boots once (no per-request dev recompiles) and auto-applies
      # pending evolutions at startup (play.evolutions.db.default.autoApply=true), and `localhost` is in
      # play.filters.hosts.allowed.
      - name: Stage the app (prod-mode binary)
        run: sbt stage

      # pidfile to /dev/null so a retry on the same runner can't trip over a stale RUNNING_PID.
      #
      # config.resource is load-bearing, not a stylistic choice. application.ci.conf includes application.local.conf,
      # and that overlay is half the reason: the base conf/application.conf scopes both the Play session cookie and
      # the Silhouette authenticator to Domain=".cs.washington.edu" (they are
      # shared across the per-city subdomains in production), and a browser drops any cookie whose Domain doesn't match
      # the host it is talking to. At http://localhost:9000 that means no session can ever stick, so every SecuredAction
      # page ping-pongs with /anonSignUp until Chromium gives up with ERR_TOO_MANY_REDIRECTS. The local overlay is
      # exactly the "app served over plain http at localhost:9000" profile — it nulls both cookie domains and pins
      # play.filters.hosts.allowed to localhost:9000 — so it is the honest base to boot under here. It cannot be
      # expressed as -D flags: a system property is always a string, so -Dplay.http.session.domain=null would set the
      # literal Domain "null" rather than clearing it.
      #
      # application.ci.conf layers onto that overlay and additionally disables ActorModule, because this job now
      # seeds real data and then asserts on it -- see the reasoning in the file. backend-tests needs neither: its
      # specs build their own application and disable the module themselves.
      - name: Start the app
        run: |
          nohup target/universal/stage/bin/sidewalk-webpage \
            -Dconfig.resource=application.ci.conf \
            -Dhttp.port=9000 -Dplay.server.pidfile.path=/dev/null > app.log 2>&1 &

      # /signIn is a UserAwareAction: 200 with no auth and no session bootstrap — the cheapest unauthenticated
      # route that proves routing + DB + evolutions all came up.
      - name: Wait for the app to serve HTTP
        id: app-ready
        run: |
          for i in $(seq 1 120); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:9000/signIn || true)
            if [ "$code" = "200" ]; then echo "App is up."; exit 0; fi
            sleep 2
          done
          echo "App did not come up in time (last status: $code)."; tail -100 app.log; exit 1

      # Shared with backend-tests. Without a region /explore is a server error; without labels the Gallery,
      # LabelMap and api-docs previews render empty shells the suite can't judge. Runs after the app is up, so the
      # schema is already at HEAD.
      - name: Seed the test city
        run: docker compose exec -T db psql -v ON_ERROR_STOP=1 -U postgres -d sidewalk < test/e2e/fixtures/ci-seed.sql

      # Every seeded panorama is expired, so the app resolves imagery from disk. This is what puts it there.
      - name: Install the seeded imagery
        run: bash test/e2e/fixtures/install-media.sh

      # A page only enters the shared table (test/e2e/pages.js) once its violations are fixed or tracked, so a failure
      # here is a regression, never a known gap (#5060). Runs first so a red gate heads the log.
      - name: Run accessibility gate (blocking)
        run: npx playwright test --project=a11y
        env:
          BASE_URL: http://localhost:9000
          PLAYWRIGHT_HTML_REPORT: playwright-report/a11y

      # The condition runs this half even when the gate is red, but unlike `always()` skips it when the app never came
      # up, where every spec would otherwise time out against a dead server.
      - name: Run Playwright smoke suite
        if: ${{ !cancelled() && steps.app-ready.outcome == 'success' }}
        run: npx playwright test --project=chromium
        env:
          BASE_URL: http://localhost:9000
          PLAYWRIGHT_HTML_REPORT: playwright-report/smoke

      - name: Upload Playwright report + app log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-smoke-report
          path: |
            playwright-report/
            test-results/
            app.log
          retention-days: 7

  python-tests:
    name: Python tests (${{ matrix.half }})
    runs-on: ubuntu-latest
    # Per leg, not per job: the in-band half gates merges because the running app shells out to label_clustering.py,
    # while the offline half only covers an operator utility that never runs on the server.
    continue-on-error: ${{ matrix.advisory }}
    strategy:
      fail-fast: false
      # One leg per interpreter the web container ships, testing each script on the Python that runs it (#4396):
      # label_clustering.py is shelled out to by the app, so it stays on prod's EOL 3.8; the offline tooling needs
      # >= 3.12. Mirrors the `pytest-args-*` and `cov-omit-*` variables in the Makefile — each leg takes the whole
      # directory minus the files only the other's interpreter can import (shapely/geopandas are 3.13-only here), so a
      # new test file runs in both rather than in neither.
      # `half` also spells the check name, and `Python tests (in-band script)` is a required check — renaming a half
      # renames the check, which branch protection then waits forever for. Update both together.
      matrix:
        include:
          - half: in-band script
            advisory: false
            python: '3.8'
            requirements: -r requirements.txt -r requirements-dev.txt
            pytest-args: >-
              test/python --ignore=test/python/test_check_streets_for_imagery.py
              --ignore=test/python/test_onboard_city.py --ignore=test/python/test_street_gradient.py
            coverage-omit: tools/city/check_streets_for_imagery.py
            coverage-omit-2: tools/city/onboard_city.py
            coverage-omit-3: tools/city/street_gradient.py
          - half: offline tooling
            advisory: true
            python: '3.13'
            requirements: -r requirements-offline-tools.txt -r requirements-dev.txt
            pytest-args: test/python --ignore=test/python/test_label_clustering.py
            coverage-omit: scripts/label_clustering.py
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      # The pure-logic unit tests need no DB and no network, only this half's runtime deps plus pytest.
      - name: Install dependencies
        run: pip install ${{ matrix.requirements }}

      - name: Run pytest
        run: pytest ${{ matrix['pytest-args'] }}
        env:
          COVERAGE_OMIT: ${{ matrix['coverage-omit'] }}
          COVERAGE_OMIT2: ${{ matrix['coverage-omit-2'] }}
          COVERAGE_OMIT3: ${{ matrix['coverage-omit-3'] }}

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    # Only a PR has a before and after to compare.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/dependency-review-action@v5
