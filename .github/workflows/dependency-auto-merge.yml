name: Dependency auto-merge

# Enable GitHub auto-merge for green patch & minor dependency bumps so they clear the review queue on their
# own once the required checks pass. Majors, and anything a required check fails, still wait for a human.
# Branch protection's required checks are the only gate, so a bump they don't exercise merges unreviewed.
# See issue #4385, workstream B.
#
# No `pull_request_target`: GitHub blocks it by default in public repos (#5944). Both jobs hold a write token, so never
# check out or run PR code here. A PR whose auto-merge a person last turned off is left alone, so no run undoes a hold.

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, ready_for_review]
  # Scala Steward's PRs come from a fork, whose `pull_request` runs only get a read-only token.
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependabot:
    # Dependabot: derive the semver bump from official metadata (reliable), auto-merge patch & minor.
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    # A Dependabot run's token is read-only unless the workflow asks for more.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      # Every Dependabot push re-runs this job.
      - name: Check for a hold
        id: hold
        run: |
          set -euo pipefail
          reason=$(gh api graphql -f owner="${GITHUB_REPOSITORY%/*}" -f name="${GITHUB_REPOSITORY#*/}" \
            -F number="$PR_NUMBER" \
            -f query='query($owner: String!, $name: String!, $number: Int!) {
              repository(owner: $owner, name: $name) { pullRequest(number: $number) {
                timelineItems(itemTypes: [AUTO_MERGE_DISABLED_EVENT], last: 1) {
                  nodes { ... on AutoMergeDisabledEvent { reasonCode } }
                }
              } }
            }' --jq '.data.repository.pullRequest.timelineItems.nodes[0].reasonCode // ""')
          echo "held=$([ "$reason" = manually_disabled ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The npm-imagery groups (dependabot.yml) are left out: nothing in CI drives a pano viewer, so their bumps wait
      # for a person to try them in a city that uses each one.
      - name: Enable auto-merge for patch & minor
        if: >-
          steps.hold.outputs.held == 'false' && !startsWith(steps.meta.outputs.dependency-group, 'npm-imagery') && (
          steps.meta.outputs.update-type == 'version-update:semver-patch' ||
          steps.meta.outputs.update-type == 'version-update:semver-minor')
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  scala-steward:
    # The hosted Steward can't apply GitHub labels, so it writes them into the PR body instead. Early-semver is the
    # Scala convention: a 0.x minor counts as breaking. A PR with more than one commit carries generated edits (e.g. a
    # scalafmt reformat of the whole codebase), so it waits for a human. A failure only warns, or a stuck PR would fail
    # every hourly run.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Enable auto-merge for patch & minor
        run: |
          set -euo pipefail
          prs=$(gh api graphql -f q="repo:$GITHUB_REPOSITORY is:pr is:open author:scala-steward" -f query='
            query($q: String!) {
              search(query: $q, type: ISSUE, first: 100) {
                nodes {
                  ... on PullRequest {
                    url isDraft body autoMergeRequest { enabledAt } commits { totalCount }
                    timelineItems(itemTypes: [AUTO_MERGE_DISABLED_EVENT], last: 1) {
                      nodes { ... on AutoMergeDisabledEvent { reasonCode } }
                    }
                  }
                }
              }
            }' --jq '.data.search.nodes[]
              | select((.isDraft | not) and .autoMergeRequest == null and .commits.totalCount == 1
                and (.body | test("early-semver-(patch|minor)"))
                and .timelineItems.nodes[0].reasonCode != "manually_disabled")
              | .url')
          for url in $prs; do
            echo "Enabling auto-merge on $url"
            gh pr merge --auto --merge "$url" || echo "::warning::Could not enable auto-merge on $url"
          done
          [ -n "$prs" ] || echo "No Scala Steward PR needs auto-merge."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
