name: Dependency auto-merge

# Enable GitHub auto-merge for green patch & minor dependency bumps so they clear the review queue on their
# own once the required checks pass. Majors, and anything a required check fails, still wait for a human.
# Branch protection's required checks are the only gate, so a bump they don't exercise merges unreviewed.
# See issue #4385, workstream B.
#
# `pull_request_target` runs in the base-repo context (needed for the token to enable auto-merge on bot PRs),
# so this workflow file must never checkout or execute PR-authored code.

on:
  pull_request_target:
    types: [opened, reopened, synchronize, labeled, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    # Dependabot: derive the semver bump from official metadata (reliable), auto-merge patch & minor.
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      # pip is left out: the only CI leg that installs its bumps (offline tooling) is advisory, so a broken one would
      # merge and break the web image build.
      - name: Enable auto-merge for patch & minor
        if: >-
          steps.meta.outputs.package-ecosystem != 'pip' && (
          steps.meta.outputs.update-type == 'version-update:semver-patch' ||
          steps.meta.outputs.update-type == 'version-update:semver-minor')
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  scala-steward:
    # The hosted Steward opens PRs from a fork, so it can't apply GitHub labels; it writes them into the PR body
    # instead. Early-semver is the Scala convention: a 0.x minor counts as breaking. A PR with more than one commit
    # carries generated edits (e.g. a scalafmt reformat of the whole codebase), so it waits for a human. A grouped PR
    # lists every update's labels, so one major in the group must hold the whole PR back.
    if: >-
      github.actor == 'scala-steward' &&
      contains(github.event.pull_request.body, 'commit-count:1') &&
      !contains(github.event.pull_request.body, 'early-semver-major') &&
      (contains(github.event.pull_request.body, 'early-semver-patch') ||
       contains(github.event.pull_request.body, 'early-semver-minor'))
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge for patch & minor
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
