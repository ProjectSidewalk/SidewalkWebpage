version: 2
# Dependabot has no native sbt/Scala updater — those are handled by the hosted Scala Steward instance
# (this repo is registered with VirtusLab's public instance; config in `.scala-steward.conf`). Dependabot
# here covers npm, GitHub Actions, Docker, and Python (pip).
#
# Cadence is monthly so version-currency PRs arrive as one predictable batch for a two-person team, rather
# than a weekly trickle. This throttles *version* noise only — Dependabot *security* updates (GHSA/CVE-driven)
# are a separate channel and still fire immediately (enable them in Settings → Code security). Green patch &
# minor bumps auto-merge via `.github/workflows/dependency-auto-merge.yml`; majors and deliberate freezes need
# a human. See issue #4385 for the standing dependency/platform maintenance strategy.
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      npm-dependencies:
        patterns: ["*"]
    ignore:
      # The frontend lint/test toolchain is deliberately pinned. All four linters are blocking steps in CI's
      # `frontend` job, so a major bump here turns the build red rather than merely nagging. Two pins are load-bearing:
      # `eslint` is held at 9 (now EOL upstream — the move to 10 is #5132) and `jest` at 29. `@eslint/js` tracks
      # eslint's major exactly, so leaving it un-ignored yields an unresolvable tree — #5106 bumped it to 10 against
      # eslint ^9, npm install died with ERESOLVE, and nothing installed, which surfaced as `jest: not found`.
      # The stylelint/htmlhint entries are inert (we're already on their latest); #5132 covers trimming them.
      # (@playwright/test is deliberately NOT ignored: it's CI-wired from day one — the e2e-smoke job — and CI
      # reinstalls matching browsers every run, so grouped monthly bumps + green auto-merge cover it.)
      - dependency-name: "eslint"
      - dependency-name: "@eslint/js"
      - dependency-name: "htmlhint"
      - dependency-name: "jest"
      - dependency-name: "jest-environment-jsdom"
      - dependency-name: "stylelint"
      - dependency-name: "stylelint-config-standard"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: monthly
    groups:
      docker:
        patterns: ["*"]
    ignore:
      # Stay on JDK 17 (an LTS). Dependabot keeps re-proposing odd, non-LTS temurin majors (19, 21-preview…);
      # 19 was already rejected as EOL (#4247). The Java 17→21 LTS move is a deliberate, tracked migration
      # (#4385, #3936), not a bot bump. Minor/OS bumps within 17 (e.g. focal→jammy) are still allowed.
      - dependency-name: "eclipse-temurin"
        update-types: ["version-update:semver-major"]

  # Watch the Python deps in requirements*.txt so their security alerts (requests, pytest, tqdm) get auto-fix
  # PRs like the other ecosystems (#4385, workstream A).
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    groups:
      pip-dependencies:
        patterns: ["*"]
    ignore:
      # requirements.txt is frozen at the last releases that install on Python 3.8 — the interpreter the deployed app
      # shells out to for in-band clustering (docs/upgrading-libraries.md). scipy and haversine appear *only* in that
      # file, so a bump is always wrong and always fails CI (#5108). pandas and requests stay watched despite being
      # frozen there too: they're shared with requirements-offline-tools.txt (3.13), Dependabot's pip updater can't
      # scope an ignore to one requirements file, and an ignore would suppress that file's security PRs as well.
      # Retiring 3.8 (#4385) is what actually ends the monthly noise — and is the only way to clear
      # GHSA-gc5v-m9x4-r6x2, whose fix (requests 2.33.0) declares requires_python >= 3.10.
      - dependency-name: "scipy"
      - dependency-name: "haversine"
