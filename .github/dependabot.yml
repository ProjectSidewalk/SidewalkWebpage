version: 2
# Dependabot has no native sbt/Scala updater — those are handled by the hosted Scala Steward instance
# (this repo is registered with VirtusLab's public instance; config in `.scala-steward.conf`). Dependabot
# here covers npm, GitHub Actions, Docker, and Python (pip).
#
# Cadence is monthly so version-currency PRs arrive as one predictable batch for a two-person team, rather
# than a weekly trickle. This throttles *version* noise only — Dependabot *security* updates (GHSA/CVE-driven)
# are a separate channel and still fire immediately (enable them in Settings → Code security). Green patch &
# minor bumps auto-merge via `.github/workflows/dependency-auto-merge.yml`; majors and deliberate freezes need
# a human. Each ecosystem gets two groups so a red major can't hold the safe patch & minor bumps hostage in the
# same PR (#4395). See issue #4385 for the standing dependency/platform maintenance strategy.
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      npm-patch-minor:
        patterns: ["*"]
        update-types: ["patch", "minor"]
      npm-major:
        patterns: ["*"]
        update-types: ["major"]
    ignore:
      # Everything that supplies `error`-severity rules to a blocking `frontend` step, plus the jsdom suite: a
      # *major* here turns the build red rather than merely nagging, so majors stay a human decision while minors
      # and patches auto-merge. That includes the rule *providers*, not just the runners — @stylistic/eslint-plugin
      # alone contributes ~50 of the ESLint gate's rules via configs.customize(). `@eslint/js` is version-locked to
      # eslint's major and has to move in the same PR it does: bumped alone it yields an unresolvable tree (#5106
      # took it to 10 against eslint ^9; npm install died with ERESOLVE and nothing installed at all, surfacing
      # downstream as `jest: not found`). `@eslint/json` is *not* so locked — its 2.x supports eslint 9 and 10 —
      # and is here only because it gates 63 locale files.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/json"
        update-types: ["version-update:semver-major"]
      - dependency-name: "htmlhint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "jest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "jest-environment-jsdom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "stylelint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "stylelint-config-standard"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@stylistic/eslint-plugin"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint-plugin-jsdoc"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@stylistic/stylelint-plugin"
        update-types: ["version-update:semver-major"]
      - dependency-name: "stylelint-plugin-use-baseline"
        update-types: ["version-update:semver-major"]
      # A TypeScript major changes what `make lint-js-types` reports.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      github-actions-patch-minor:
        patterns: ["*"]
        update-types: ["patch", "minor"]
      github-actions-major:
        patterns: ["*"]
        update-types: ["major"]

  - package-ecosystem: docker
    # docker/shellcheck/ holds only the ShellCheck image pin that `make shellcheck` and CI run (#5589).
    directories: ["/", "/docker/shellcheck"]
    schedule:
      interval: monthly
    groups:
      docker-patch-minor:
        patterns: ["*"]
        update-types: ["patch", "minor"]
      docker-major:
        patterns: ["*"]
        update-types: ["major"]
    ignore:
      # Stay on JDK 17 (an LTS). Dependabot keeps re-proposing odd, non-LTS temurin majors (19, 21-preview…);
      # 19 was already rejected as EOL (#4247). The Java 17→21 LTS move is a deliberate, tracked migration
      # (#4385, #3936), not a bot bump. Minor/OS bumps within 17 (e.g. focal→jammy) are still allowed.
      - dependency-name: "eclipse-temurin"
        update-types: ["version-update:semver-major"]

  # Watch the Python deps in requirements*.txt so their security alerts (requests, pytest, tqdm) get auto-fix
  # PRs like the other ecosystems (#4385, workstream A).
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    groups:
      pip-patch-minor:
        patterns: ["*"]
        update-types: ["patch", "minor"]
      pip-major:
        patterns: ["*"]
        update-types: ["major"]
    # requirements.txt is frozen for the app's Python 3.8 (docs/upgrading-libraries.md): every bump fails CI and no
    # security fix can install there either. Retiring 3.8 (#4385) brings it back.
    exclude-paths:
      - "requirements.txt"
