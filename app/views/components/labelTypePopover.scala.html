@*
* The popover of label-type chips that labelTypeTrigger's button opens, filled in by LabelTypeDropdown. Separate
* from the trigger so a host can put it outside a heading, where the chips would be read as part of the heading.
*@
@()

<div class="label-type-popover" popover hidden>
  <p class="label-type-popover__hint" hidden></p>
  <div class="label-type-popover__chips"></div>
</div>
