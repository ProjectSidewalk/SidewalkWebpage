@*
* Story composer dialog (#4054): the shared markup StoryComposer.js drives, both for writing a new story and for
* editing one in place. Rendered twice on some pages — inside `common.labelDetail` for the label card, and standalone
* on the user dashboard for the "Your stories" list — so every `<label for>` target id is namespaced by `idPrefix`
* (htmlhint input-requires-label needs real ids, and duplicated ones would point a label at the other dialog's
* input). Radio `name`s and the dialog's aria-labelledby id are made instance-unique by JS at init.
*
* @param idPrefix Unique-per-page prefix for this instance's dialog id and input ids.
*@
@(idPrefix: String = "story-composer")(implicit assets: AssetsFinder)

<dialog class="story-composer" id="@idPrefix">
  @* Same discard guard as Cancel (StoryComposer wires both through #requestClose). *@
  <button type="button" class="story-composer__close" aria-label="Close"
          data-i18n-aria-label="labelmap:story.close">
    <img src='@assets.path("images/icons/cross.svg")' alt="">
  </button>
  <h3 class="story-composer__title" data-i18n="labelmap:story.composer-title">Write your story</h3>
  <p class="story-composer__intro" data-i18n="labelmap:story.composer-intro">
    Stories help neighbors and city officials understand what problems like this mean for real people.
    Your story will appear attached to this label.
  </p>
  <label class="story-composer__field" for="@{idPrefix}-text">
    <span class="story-composer__field-label" data-i18n="labelmap:story.your-story">Your story</span>
    <textarea class="story-composer__text" id="@{idPrefix}-text" rows="5"
              data-i18n-placeholder="labelmap:story.text-placeholder"></textarea>
  </label>
  <div class="story-composer__counter" aria-hidden="true"></div>
  <div class="story-composer__photo-row">
    <label class="story-composer__photo-attach" for="@{idPrefix}-photo">
      @* Accepted types must stay in sync with StoryService's sniffed-format allowlist (stock ImageIO: no WebP). *@
      <input type="file" id="@{idPrefix}-photo" class="story-composer__photo-input sr-only"
             accept="image/jpeg,image/png">
      <span data-i18n="labelmap:story.add-photo">Add a photo (optional)</span>
    </label>
    <div class="story-composer__photo-preview" hidden>
      <img class="story-composer__photo-thumb" alt="" width="120" height="90">
      <div class="story-composer__photo-fields">
        <label class="story-composer__field" for="@{idPrefix}-alt">
          <span class="story-composer__field-label" data-i18n="labelmap:story.photo-alt-label">
            Describe the photo for people who can't see it (optional)
          </span>
          <input type="text" id="@{idPrefix}-alt" class="story-composer__alt-input">
        </label>
        <button type="button" class="story-composer__photo-remove"
                data-i18n="labelmap:story.remove-photo">Remove photo</button>
      </div>
    </div>
  </div>
  <fieldset class="story-composer__post-as">
    <legend class="story-composer__field-label" data-i18n="labelmap:story.post-as">Post as</legend>
    @* Both rows share one shape — name pill, then a plain description — so the choice reads symmetrically.
       The username pill has no data-i18n: StoryComposer.js fills it with the account's username. *@
    <label class="story-composer__check-row" for="@{idPrefix}-name-anon">
      <input type="radio" id="@{idPrefix}-name-anon" class="story-composer__name-anon" checked>
      <span class="story-composer__name-pill" data-i18n="labelmap:story.anonymous">Anonymous</span>
      <span class="story-composer__name-desc" data-i18n="labelmap:story.post-anonymous-desc">no name shown</span>
    </label>
    <label class="story-composer__check-row" for="@{idPrefix}-name-username">
      <input type="radio" id="@{idPrefix}-name-username" class="story-composer__name-username">
      <span class="story-composer__name-pill story-composer__username-option"></span>
      <span class="story-composer__name-desc" data-i18n="labelmap:story.post-username-desc">your username shown</span>
    </label>
  </fieldset>
  @* Sign-in CTA (#4054): shown only to anonymous-session viewers. StoryComposer.js stashes the in-progress draft
     (text, photo, options) to IndexedDB and returns here via ?resumeStory=<id>, so signing in loses no work. *@
  <p class="story-composer__signin-cta" hidden>
    <span data-i18n="labelmap:story.signin-prompt">Have an account?</span>
    <button type="button" class="story-composer__signin-btn"
            data-i18n="labelmap:story.signin-cta">Sign in to post under your name</button>
  </p>
  @* No data-i18n: the note embeds a link, so StoryComposer.js sets the translated string via innerHTML instead
     (the binder writes textContent, which would show the anchor markup literally). *@
  @* The dashboard link opens a new tab: navigating away here would lose the in-progress story. *@
  <p class="story-composer__privacy">
    You can review, edit, or delete your stories from
    <a href="/dashboard" target="_blank" rel="noopener">your dashboard</a>. Photos are moderated.
  </p>
  <p class="story-composer__error" role="alert" hidden></p>
  <div class="story-composer__actions">
    <button type="button" class="story-composer__cancel" data-i18n="labelmap:story.cancel">Cancel</button>
    <button type="button" class="story-composer__submit" data-i18n="labelmap:story.submit">Share story</button>
  </div>
</dialog>
