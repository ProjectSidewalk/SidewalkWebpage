# Scala Steward config for the hosted VirtusLab public instance (sbt/Scala deps only).
# Companion to `.github/dependabot.yml` (npm/Actions/Docker) and issue #4385 (maintenance strategy).

# One predictable batch per month rather than a weekly trickle — matches the Dependabot cadence and suits a
# two-person team. Security-relevant bumps still surface here; the throttle is about grouping, not suppressing.
pullRequests.frequency = "@monthly"

# Play's sbt plugin and libraries share one version, so bumping only some of them leaves the build on two Plays.
pullRequests.grouping = [
  { name = "play", title = "Update Play", filter = [{ group = "org.playframework" }] }
]

updates.pin = [
  # Stay on the 3.9 LTS line: a 3.10 bump would auto-merge as "minor", and a new LTS is a project of its own (#5605).
  { groupId = "org.scala-lang", artifactId = "scala3-library", version = "3.9." },
  { groupId = "org.scala-lang", artifactId = "scala3-compiler", version = "3.9." }
]
