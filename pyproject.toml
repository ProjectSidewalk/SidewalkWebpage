# Python tooling config for the standalone utility scripts in scripts/ and their tests in test/python/.
# (The application itself is Scala/Play; this file only covers the Python utilities.)

[tool.pytest.ini_options]
# Only collect the Python utility tests; keep pytest away from the Scala/JS test trees.
testpaths = ["test/python"]
# Put scripts/ and tools/ on sys.path so tests can `import label_clustering` / `import verify_latlng_backfill`
# without packaging.
pythonpath = ["scripts", "tools"]
python_files = ["test_*.py"]
# Branch coverage, so both sides of every decision must be exercised, and a hard gate at full coverage. Which module
# is measured is *not* set here: the suite is split across the container's two interpreters (see `make test-python`),
# and each run passes its own `--cov=` so the gate covers exactly the module that run can import.
addopts = "--cov-branch --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true
# The script entrypoint guard only runs when executed as `python3 scripts/...`, never under pytest.
exclude_also = [
    "if __name__ == .__main__.:",
]
