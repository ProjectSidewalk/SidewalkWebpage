# Python tooling config for the standalone utility scripts in scripts/ and their tests in test/python/.
# (The application itself is Scala/Play; this file only covers the Python utilities.)

[tool.pytest.ini_options]
# Only collect the Python utility tests; keep pytest away from the Scala/JS test trees.
testpaths = ["test/python"]
# Put scripts/ and tools/ on sys.path so tests can `import label_clustering` / `import verify_latlng_backfill`
# without packaging.
pythonpath = ["scripts", "tools"]
python_files = ["test_*.py"]
# Always measure correctness coverage and fail the run if it regresses below the gate. Branch coverage is on so both
# sides of every decision must be exercised, not just every line. Bare `--cov` (no value) rather than `--cov=scripts`
# is deliberate: the suite is split across the container's two interpreters (see `make test-python`), and naming a
# directory would make coverage report the half the running interpreter *cannot* import as 0% and fail the gate on
# both halves. Scoping is left to `include` below, which filters what was measured instead of enumerating what should
# have been — so each half reports exactly the script it exercised, and no invocation can lose the gate.
addopts = "--cov --cov-branch --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
branch = true
# `include`, not `source`: `source` additionally reports files it never saw imported as 0%, which is what would break
# the split above. Kept to scripts/ so tools/ (one-off utilities, not held to the gate) stays out.
include = ["scripts/*"]

[tool.coverage.report]
show_missing = true
# The script entrypoint guard only runs when executed as `python3 scripts/...`, never under pytest.
exclude_also = [
    "if __name__ == .__main__.:",
]
