include "application.local.conf"

# Config overrides for CI's e2e-smoke job, which boots the staged binary against a seeded database.
#
# It layers on application.local.conf because CI serves the same profile that file exists for: plain http on
# localhost:9000, where the production cookie domains would make every session drop.
#
# The nightly actors are off here. Each one schedules itself for a fixed wall-clock time shifted by the city's
# update_offset_hours, so its first tick falls uniformly at random within 24 hours -- a job this long has a small but
# real chance of catching one. That was harmless while CI ran on an empty schema and every tick was a no-op; against
# a seeded one UserStatActor would rewrite the same user_stat columns the seed pins, RecalculateStreetPriorityActor
# the priorities region_completion is derived from, and the imagery sweeps would call Google and Mapillary with dummy
# credentials. Disabling the module is what keeps a required check from failing a few runs in a hundred (#5115).
#
# It must be `+=`: play.modules.disabled already carries silhouette.conf's two entries, and a -D system property
# would replace that list rather than extend it, which fails the boot with duplicate Silhouette bindings.
play.modules.disabled += "modules.ActorModule"
