# This is the main configuration file for the application.

# Include custom modules that we've defined.
play.application.loader = "CustomApplicationLoader"
play.modules.enabled += "modules.CustomControllerModule"
play.modules.enabled += "modules.ActorModule"
play.modules.enabled += "modules.ExecutorsModule"
play.modules.enabled += "modules.StartupChecksModule"

# The secret key is used to secure cryptographics functions. Set through an env variable on production servers.
# See http://www.playframework.com/documentation/latest/ApplicationSecret for more details.
play.http.secret.key=${?SIDEWALK_APPLICATION_SECRET}

# HMAC-SHA256 secret for signing time-limited image-serving URLs (/backupImage and /cropImage endpoints).
# Defaults to the application secret so existing deployments keep working, but set IMAGE_SIGNING_SECRET in prod to a
# distinct value so the image-signing key and the Play application secret can be rotated independently.
image.signing.secret=${play.http.secret.key}
image.signing.secret=${?IMAGE_SIGNING_SECRET}

# Environment type: local, test, or prod.
environment-type = "local"
environment-type = ${?ENV_TYPE}

# Define available languages. Translations are in conf/messages for back end and in public/locales for front end.
play.i18n.langs = [ "en", "es", "nl", "zh-TW", "de", "pt-BR", "en-US", "en-NZ" ]
play.i18n.defaultLang = "en"
play.i18n.langCookieName = "PROD_PLAY_LANG"
play.i18n.path = "messages" # Location of messages files for internationalization, relative to the conf directory.

# Asset configuration.
play.assets {
  path = "/public"
  urlPrefix = "/assets"
}

# Prevent timing out on long-running API requests. Fixes https://github.com/ProjectSidewalk/SidewalkWebpage/issues/3544.
play.server.http.idleTimeout = 5 minutes # Default is 75 seconds.

# Allow larger request headers to account for large cookies from numerous cities.
# Fixes https://github.com/ProjectSidewalk/SidewalkWebpage/issues/3381.
play.server.max-header-size = 32k # Default is 8k.

# Default database configuration.
slick.dbs.default.profile="models.utils.MyPostgresProfile$"
slick.dbs.default.db.driver = "org.postgresql.Driver"
slick.dbs.default.db.url="jdbc:postgresql://db:5432/sidewalk"
slick.dbs.default.db.url=${?DATABASE_URL}
slick.dbs.default.db.user="sidewalk"
slick.dbs.default.db.user=${?DATABASE_USER}
slick.dbs.default.db.password="sidewalk"
slick.dbs.default.db.password=${?DATABASE_PASSWORD}

# Evolutions configuration. To apply them globally, use play.evolutions instead of play.evolutions.db.default.
# But we only have one db, so that doesn't matter for our purposes.
# https://www.playframework.com/documentation/3.0.x/Evolutions#Evolutions-configuration
play.evolutions.db.default.enabled=true
play.evolutions.db.default.autocommit=false # Makes each evolution run in a transaction, so all is rolled back on fail.
play.evolutions.db.default.autoApply=true
play.evolutions.db.default.autoApplyDowns=true
play.evolutions.db.default.substitutions.mappings = {
  city-id = ${?SIDEWALK_CITY_ID} # Used in evolutions to set the city id for the current city.
}

# Configure thread pools. Slick has it's own, there's the main Play thread pool, and our custom cpu-intensive pool.
# NOTE numThreads must be set to the same number as maxConnections.
# https://www.playframework.com/documentation/3.0.x/PlaySlickAdvancedTopics#Thread-Pool
slick.dbs.default.db.numThreads = 25          # Default is 20
slick.dbs.default.db.maxConnections = 25      # Default is 20
slick.dbs.default.db.minConnections = 2
#slick.dbs.default.db.queueSize = 1000        # Default is 1000
slick.dbs.default.db.connectionTimeout = 30s
slick.dbs.default.db.idleTimeout = 2 minutes  # Close connections often to share w/ other cities. Default is 10 minutes.
slick.dbs.default.db.maxLifetime = 30 minutes

# Custom execution context for CPU-intensive operations like data conversion, image processing, etc. Used to prevent
# blocking the main thread pool when doing long-running operations. Slick manages it's own thread pool for the db.
# Some configs explained here: https://pekko.apache.org/docs/pekko/1.1/general/configuration-reference.html
cpu-intensive {
  executor = "fork-join-executor"
  throughput = 1             # Default is 5.
  fork-join-executor {
    parallelism-min = 2      # Default is 8. Using fewer long-running threads for CPU-intensive work.
    parallelism-factor = 1.0 # Default is 1.0.
    parallelism-max = 4      # Default is 64. Using fewer long-running threads for CPU-intensive work.
  }
}

# Sets the execution context that Materializer uses for running streams. We tend to use this for the CPU-intensive API.
pekko.stream.materializer.dispatcher = "cpu-intensive"

# Add gzip compression to any text-based responses to improve load times and reduce bandwidth usage.
# https://www.playframework.com/documentation/3.0.x/GzipEncoding
play.filters.enabled += "play.filters.gzip.GzipFilter"
play.filters.gzip {
  threshold = 1k # Don't compress responses smaller than this size to avoid unnecessary overhead.
  contentType {
    whiteList = [
      "text/*",
      "application/javascript",
      "application/json",
      "application/xml",
      "application/x-protobuf",
      "application/geopackage+sqlite3",
      "image/svg+xml" // SVGs are text, so they compress well with gzip.
    ]
  }
}

# Add CORS filter to allow cross-origin requests from front ends between cities.
play.filters.enabled += "play.filters.cors.CORSFilter"
play.filters.cors.pathPrefixes = ["/v3/api/"] # Only enable CORS for API endpoints.

# Set up Content Security Policy (CSP) filter.
# NOTE This is still report-only (reportOnly = true) -- nothing is blocked yet. The directives below allowlist the known,
# legitimate third-party origins the app actually loads (Google Analytics/Tag Manager, Google Maps + Street View, Mapbox
# GL) so that the remaining reports are signal rather than noise. Everything else we load -- Vega, the pano
# viewers, our own web fonts -- is vendored under public/vendor/ (or public/fonts/) and served from 'self'. Once the
# reports are quiet, flip reportOnly = false to start enforcing.
# https://www.playframework.com/documentation/3.0.x/CspFilter#Configuring-CSP.
play.filters.enabled += play.filters.csp.CSPFilter
play.filters.csp {
  reportOnly = true
  directives = {
    # No report-uri here, so the policy is inert on prod: a report-only policy with no reporting destination isn't
    # evaluated by the browser at all, meaning no protection and no data (WebKit also logs a "will have no effect"
    # warning once per document). Reporting is switched on per-environment in application.local.conf and
    # application.test.conf instead, to measure the report volume on -test before prod logs take it -- see #4793,
    # which also tracks flipping reportOnly = false once the reports are quiet. Staging deliberately stays inert
    # like prod: -test is the designated measuring point, and staging's traffic adds nothing but log volume.
    default-src = "'self'"

    # Scripts: gtag.js from Tag Manager (Google Analytics) and the Google Maps JS API. 'unsafe-inline'/'unsafe-eval'
    # are required by the Maps bootstrap + Mapbox GL runtime. GA4 loads its script only from googletagmanager.com;
    # google-analytics.com is a beacon/pixel host and lives in connect-src/img-src, not here.
    script-src = "'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com https://maps.googleapis.com"

    # Styles: all of ours, and every third-party stylesheet we load, come from 'self'.
    style-src = "'self' 'unsafe-inline'"

    # Images: same-origin, data:/blob: (canvas + panorama exports), Google Maps/Street View tiles (*.googleapis.com,
    # *.gstatic.com, *.ggpht.com), the GA pixel, and Mapbox tiles (Mapbox GL serves these from api.mapbox.com).
    # Panoramax pictures and tiles are served by each picture's home instance (the IGN and OSM-France ones hold
    # every French city); the meta-catalog host only answers API calls but is listed here too since its picture
    # redirects resolve there first (#5185).
    img-src = "'self' data: blob: https://*.googleapis.com https://*.gstatic.com https://*.ggpht.com https://*.google-analytics.com https://www.googletagmanager.com https://api.mapbox.com https://api.panoramax.xyz https://panoramax.ign.fr https://panoramax.openstreetmap.fr"

    # Fonts: our own from 'self', plus Lato from fonts.gstatic.com — that one is the bundled infra3d viewer's,
    # declared inside its vendor JS, not ours. data: covers inlined fonts.
    font-src = "'self' data: https://fonts.gstatic.com"

    # XHR/fetch/beacons: GA4 collect, Google Maps API, and Mapbox tiles/style/telemetry. 'self' must be listed
    # explicitly -- a set connect-src replaces the default-src fallback entirely (this is what logged the GA
    # /g/collect report).
    connect-src = "'self' https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com https://maps.googleapis.com https://*.gstatic.com https://api.mapbox.com https://events.mapbox.com https://api.panoramax.xyz https://panoramax.ign.fr https://panoramax.openstreetmap.fr"

    # Web Workers: Mapbox GL spins up its worker from a blob: URL (worker-src otherwise falls back to script-src).
    worker-src = "'self' blob:"
  }
}

# The IP is for makelab1. Not sure why it's not always being resolved to localhost though.
play.filters.hosts.allowed = ["localhost", ".cs.washington.edu", "128.208.6.31"]

# Authentication cookie settings. Updated to share across subdomains (i.e., across cities).
play.http.session {
  cookieName = "PROD_PLAY_SESSION"
  domain = ".cs.washington.edu"
  secure = true
  httpOnly = true
  sameSite = "lax"
}

# Logger defined in conf/logback.xml. Set this below to be able to use any config properties in the logback.
# https://www.playframework.com/documentation/3.0.x/SettingsLogger
play.logger.includeConfigProperties=true

# Client IPs come from Play's forwarded-header processing: request.remoteAddress walks X-Forwarded-For right-to-left
# past trustedProxies and yields the first untrusted hop, so a client-supplied X-Forwarded-For can't spoof it (#1102).
# Prod's Apache reverse proxy connects from 127.0.0.1 on the same host. These ARE Play's defaults; pinned here because
# rate limiting and activity logging depend on them. If a proxy hop is ever added or moved off-host, extend
# trustedProxies accordingly.
play.http.forwarded.version = "x-forwarded"
play.http.forwarded.trustedProxies = ["127.0.0.1", "::1"]

# API keys and secrets for various services.
mapbox-api-key = ${?MAPBOX_API_KEY}
google-maps-api-key = ${?GOOGLE_MAPS_API_KEY}
google-maps-secret = ${?GOOGLE_MAPS_SECRET}
gemini-api-key = ${?GEMINI_API_KEY}
scistarter-api-key = ${?SCISTARTER_API_KEY}
mapillary-access-token = ${?MAPILLARY_ACCESS_TOKEN}
# Full service-account key JSON for the GA4 Data API reader (Planning#8); unset or unparsable disables the admin
# traffic reporting rather than failing anything.
ga-service-account-key = ${?GA_SERVICE_ACCOUNT_KEY}
infra3d-client-id-zurich = ${?INFRA3D_CLIENT_ID_ZURICH}
infra3d-client-id-winterthur = ${?INFRA3D_CLIENT_ID_WINTERTHUR}
infra3d-client-secret-zurich = ${?INFRA3D_CLIENT_SECRET_ZURICH}
infra3d-client-secret-winterthur = ${?INFRA3D_CLIENT_SECRET_WINTERTHUR}
internal-api-key = ${?INTERNAL_API_KEY}

# Streets polled per night by the imagery-age poller (CheckImageryAgeActor, #4384). Each street costs 3 provider
# metadata requests (free for GSV, rate-limited for Mapillary), so 500 streets ≈ 1,500 requests per city per night.
# Audited streets strictly outrank unaudited ones in the rotation (their outdated_imagery flags are what the poll
# feeds), so a city with more than batch-size audited streets cycles its audited set -- one full pass per
# (audited streets / batch-size) nights -- and polls unaudited streets only when audited ones don't fill the batch.
street-imagery-poll.batch-size = 500
street-imagery-poll.batch-size = ${?STREET_IMAGERY_POLL_BATCH_SIZE}

# Additional no_imagery streets re-checked per night for regained imagery (#4929), on their own slow rotation --
# they'd never be reached through the audited-first ordering above. Additive to batch-size: 25 streets ≈ +75
# requests/night (+5%). no_imagery streets are a small minority (~1-2% of streets), so 25/night revisits each one
# every couple of weeks in a large city -- fine detection latency for a queue an admin reviews occasionally.
street-imagery-poll.no-imagery-batch-size = 25
street-imagery-poll.no-imagery-batch-size = ${?STREET_IMAGERY_POLL_NO_IMAGERY_BATCH_SIZE}

# In-memory auth rate limiting (service.RateLimiter). Enabled by default now that client IPs are spoof-resistant
# (play.http.forwarded above); set RATE_LIMIT_ENABLED=false to turn it off for a deployment. Per-IP limits are sized
# to be classroom-safe: 30-40 students behind one school NAT IP signing in/up within a few minutes must not trip them.
# The per-account brute-force backstop is login-identifier, not the per-IP login bound (#1102).
rate-limit {
  enabled = true
  enabled = ${?RATE_LIMIT_ENABLED}
  login            { max-attempts = 40,  window-seconds = 60 }   # per IP, checked before form binding
  # A second, wider bound on the same IP. The per-minute limit above caps burst rate; this caps total volume, which is
  # what credential stuffing looks like — many accounts, one guess each, slowly. 300/hr clears a full class signing in
  # (and fumbling a few passwords) with room to spare while cutting an unattended stuffing run by ~8x.
  login-ip-hourly  { max-attempts = 300, window-seconds = 3600 } # per IP, checked before form binding
  # Counts only FAILED sign-ins and is refunded on success (see UserController.authenticate), so a shared account
  # can't lock itself out and a run of typos doesn't outlive the login that fixes them.
  login-identifier { max-attempts = 10,  window-seconds = 300 }  # per submitted email/username, after binding
  signup           { max-attempts = 50,  window-seconds = 3600 } # per IP (pre-bind: rejected POSTs count too)
  forgot           { max-attempts = 10,  window-seconds = 3600 } # per IP (pre-bind) and per target email (post-bind)
  reset-password   { max-attempts = 20,  window-seconds = 3600 } # per IP (bounds token guessing + bcrypt CPU)
  # Two paths mint an anon session: a cookie-less visit to /explore or /validate (both Secured, so they 303 through
  # /anonSignUp), and a lazy first-write mint (#4442). Public pages render sessionlessly (#4643), keeping crawlers
  # off this path entirely. The tool visits dominate and size the budget: 100/hr clears a 30-40 student class behind
  # one school NAT opening Explore. The throttle response must stay a plain 429; a redirect would loop via
  # CustomSecuredErrorHandler.
  anon-signup      { max-attempts = 100, window-seconds = 3600 } # per IP
  speed-limit      { max-attempts = 60,  window-seconds = 60 }   # per IP (cache misses trigger an Overpass query)
  # Per USER, not per IP: a classroom behind one NAT is many independent sessions, and this bounds a session's runaway
  # loop rather than an attacker. An accepted report is evidence for the offline imagery checker and nothing more
  # (#4922), so a false one costs a junk row in that queue rather than lost coverage -- but a client stuck in a loop
  # files one per round trip, and 44 in 33 seconds is what production saw (#4918). A real labeler meets a handful of
  # genuinely imagery-less streets in a stretch. This is the backstop that holds no matter what the client does --
  # clients run cached bundles for up to an hour after a deploy, and old bundles have no guard of their own.
  no-imagery       { max-attempts = 10,  window-seconds = 300 }  # per user
  # Stories accept anonymous uploads that each cost a photo transcode, and the per-user DB cap resets per anonymous
  # session, so an IP bound is the practical spam/abuse floor (on top of the per-user DB cap).
  story-submit     { enabled = true, max-attempts = 20, window-seconds = 86400 } # per IP
}

# Sidewalk AI API settings. The ai-enabled flag is only used so that we can disable AI requests in the dev env.
ai-enabled = true
sidewalk-ai-api-hostname = "sidewalk-ai-api.cs.washington.edu"

# Used for sending emails with play-mailer.
play.mailer.host="localhost"
noreply-email-address="noreply@cs.washington.edu"

# For the ability to save crops on the server.
play.http.parser.maxMemoryBuffer = 100M
play.http.parser.maxDiskBuffer = 100M

# Banner link across navbar.
custom.news.ribbon.link = null

# Directories for media that must outlive a deploy. Every one of them has to be pointed at storage OUTSIDE the build
# output tree by its env var below (and never a blank value): the relative defaults are for local dev, and on a
# deployed stage they resolve inside the build output tree, which the deploy rebuild (`sbt clean stage`) deletes along
# with anything a user put there — that is how a story photo was lost in #4925. PersistentMediaDirCheck enforces this
# at boot in prod mode, and every consumer resolves its path through service.MediaDirs so the check can't drift from
# the write paths.

# Directory to store cropped images.
cropped.image.directory = ".crops"
cropped.image.directory = ${?SIDEWALK_IMAGES_DIR}

# Directory containing self-hosted pano images, organized as <dir>/<city-id>/<panoId[0:2]>/<panoId>.<ext>. These back
# up GSV imagery Google has already expired (pano_data.has_backup), so for those panos this holds the only copy
# anywhere — irreplaceable, like the story media below.
pano.images.directory = ".panos"
pano.images.directory = ${?SIDEWALK_PANO_DIR}

# The widest image the pano viewer is handed. Pannellum renders an equirectangular pano as one WebGL texture, and
# 8192 is a common MAX_TEXTURE_SIZE, so wider panos (Richmond's are 11000, newer GSV 16384) are downscaled to it
# (#4865): a copy at this width, written under cropped.image.directory as <city-id>/pano-downscaled/... and served by
# /backupImage in place of the native file. Derived data beside the crops, cut by the same nightly job, so it needs no
# store of its own — and it must not go in pano.images.directory, which is scanned by extension, where a downscaled
# copy beside a native file would be served as the native file. Changing the value needs nothing else: the next run
# recuts copies at the new width and deletes those of panos the new cap lets through natively.
pano.downscaled.max-width = 8192

# Directory for cached social-share preview images (#456), organized as <dir>/<city-id>/share_<labelId>.jpg.
share.image.directory = ".share-images"
share.image.directory = ${?SIDEWALK_SHARE_IMAGES_DIR}

# Directory for user-uploaded story media (#4054), organized as <dir>/<city-id>/story_<storyMediaId>.jpg. User content
# with a hard-delete retraction contract — never let backups of it outlive deletion longer than the backup rotation
# window.
story.media.directory = ".story-media"
story.media.directory = ${?SIDEWALK_STORY_MEDIA_DIR}

# Lived-experience stories (#4054). max-per-user-per-day is the always-on per-user submission cap enforced against the
# DB in StoryService (rate-limit.story-submit below is a separate, inert-until-enabled per-IP burst layer). The photo
# cap is on the pre-transcode upload; stored files are far smaller after re-encoding.
stories {
  max-text-length = 5000
  max-alt-text-length = 1000 # Photo description (alt text): bounded and profanity-checked like the story body.
  max-per-user-per-day = 5
  photo-max-bytes = 26214400 # 25 MiB
}

# Community-partner logos on the landing page (#4516). The cap is on the pre-transcode upload; stored logos are
# re-encoded down to at most 1 MiB (PartnerServiceImpl.MAX_LOGO_BYTES, mirrored by a CHECK in the partner table).
partners {
  logo-upload-max-bytes = 5242880 # 5 MiB
}

# Custom error handler.
play.http.errorHandler = "modules.CustomErrorHandler"

include "silhouette.conf"
include "cityparams.conf"
