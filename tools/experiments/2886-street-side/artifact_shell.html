<title>Which Side of the Street</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400&display=swap">
<style>
:root{color-scheme:light;--bg:#f8f7f3;--ink:#1e2024;--ink-2:#5a5d64;--rule:#dedcd4;--geo:#2a78d6;--head:#d4571f;--code-bg:#efede6;--table-head:#f1efe8;--link:#1f5fae}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#18191c;--ink:#ebe9e2;--ink-2:#a6a49c;--rule:#33353a;--geo:#5a9cea;--head:#f08a55;--code-bg:#232529;--table-head:#212327;--link:#7fb2f0}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#18191c;--ink:#ebe9e2;--ink-2:#a6a49c;--rule:#33353a;--geo:#5a9cea;--head:#f08a55;--code-bg:#232529;--table-head:#212327;--link:#7fb2f0}
body{background:var(--bg);color:var(--ink);font:17px/1.55 "Source Sans 3","Segoe UI",Helvetica,Arial,sans-serif;margin:0}
.wrap{max-width:78ch;margin:0 auto;padding:40px 24px 80px}
h1,h2,h3,h4{font-family:Fraunces,Georgia,"Times New Roman",serif;font-weight:600;line-height:1.2;text-wrap:balance;margin:2.2em 0 .6em}
h1.title{font-size:2.1rem;margin-top:0;font-weight:500}
h2{font-size:1.5rem;border-top:1px solid var(--rule);padding-top:1.1em}
h3{font-size:1.2rem}h4{font-size:1.05rem;color:var(--ink-2)}
p{margin:.8em 0;max-width:72ch}
a{color:var(--link);text-decoration-thickness:1px;text-underline-offset:2px}
code{font:.86em "JetBrains Mono",ui-monospace,Menlo,monospace;background:var(--code-bg);padding:.05em .3em;border-radius:3px}
pre{background:var(--code-bg);padding:14px 16px;border-radius:6px;overflow-x:auto;font:14px/1.5 "JetBrains Mono",ui-monospace,Menlo,monospace}
pre code{background:none;padding:0;font-size:inherit}
blockquote{border-left:3px solid var(--rule);margin:1.2em 0;padding:.2em 1.2em;color:var(--ink-2)}
.tbl{overflow-x:auto;margin:1.2em 0}
table{border-collapse:collapse;font-size:.92em;min-width:100%;font-variant-numeric:tabular-nums}
th,td{padding:.45em .7em;border-bottom:1px solid var(--rule);vertical-align:top;text-align:left}
th{background:var(--table-head);font-weight:600}
td:first-child{font-weight:600}
h1.title + table td:first-child{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:1.25em;white-space:nowrap;color:var(--geo);width:11ch}
img{max-width:100%;height:auto;display:block;margin:1.4em auto;border:1px solid var(--rule);border-radius:4px;background:#fff}
strong{font-weight:600}
li{margin:.3em 0}
hr{border:0;border-top:1px solid var(--rule)}
.legend{display:flex;gap:1.5em;font-size:.9em;color:var(--ink-2);margin:.6em 0 0}
.legend span::before{content:"";display:inline-block;width:.9em;height:.9em;border-radius:2px;margin-right:.4em;vertical-align:-.1em}
.legend .g::before{background:var(--geo)}.legend .h::before{background:var(--head)}
@media (max-width:600px){body{font-size:16px}.wrap{padding:24px 16px 60px}h1.title{font-size:1.7rem}}
</style>
<div class="wrap">
